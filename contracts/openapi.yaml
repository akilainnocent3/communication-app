components:
  schemas:
    AccessEntry:
      type: object
      properties:
        user:
          type: integer
        email:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        can_read:
          type: boolean
          default: true
        can_send:
          type: boolean
          default: false
        can_delete:
          type: boolean
          default: false
        can_manage:
          type: boolean
          default: false
      required:
      - display_name
      - email
      - user
    AccessEntryRequest:
      type: object
      properties:
        user:
          type: integer
        can_read:
          type: boolean
          default: true
        can_send:
          type: boolean
          default: false
        can_delete:
          type: boolean
          default: false
        can_manage:
          type: boolean
          default: false
      required:
      - user
    ActionEnum:
      enum:
      - read
      - unread
      - star
      - unstar
      - important
      - not_important
      - archive
      - move_to_inbox
      - trash
      - untrash
      - spam
      - not_spam
      - delete_forever
      - add_labels
      - remove_labels
      - move_to_label
      - snooze
      - unsnooze
      - mute
      - unmute
      - assign
      - unassign
      type: string
      description: |-
        * `read` - read
        * `unread` - unread
        * `star` - star
        * `unstar` - unstar
        * `important` - important
        * `not_important` - not_important
        * `archive` - archive
        * `move_to_inbox` - move_to_inbox
        * `trash` - trash
        * `untrash` - untrash
        * `spam` - spam
        * `not_spam` - not_spam
        * `delete_forever` - delete_forever
        * `add_labels` - add_labels
        * `remove_labels` - remove_labels
        * `move_to_label` - move_to_label
        * `snooze` - snooze
        * `unsnooze` - unsnooze
        * `mute` - mute
        * `unmute` - unmute
        * `assign` - assign
        * `unassign` - unassign
    ActionRequestRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        thread_ids:
          type: array
          items:
            type: integer
          maxItems: 5000
        select_all:
          allOf:
          - $ref: '#/components/schemas/SelectionQueryRequest'
          nullable: true
        label_ids:
          type: array
          items:
            type: string
            minLength: 1
        until:
          type: string
          format: date-time
          nullable: true
        assignee:
          type: integer
          nullable: true
      required:
      - action
    ActionResult:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/ThreadSummary'
        deleted_ids:
          type: array
          items:
            type: integer
        undo_token:
          type: string
          nullable: true
      required:
      - deleted_ids
      - threads
      - undo_token
    Address:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
          default: ''
      required:
      - email
    AddressRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        name:
          type: string
          default: ''
      required:
      - email
    Alert:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
      required:
      - code
      - label
    Assignee:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - email
      - id
    Assignment:
      type: object
      properties:
        assignee:
          type: object
          additionalProperties: {}
        status:
          type: string
      required:
      - assignee
      - status
    Attachment:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        inline:
          type: boolean
        url:
          type: string
      required:
      - filename
      - id
      - inline
      - mime_type
      - size
      - url
    Attestation:
      type: object
      properties:
        present:
          type: boolean
        chain_valid:
          type: boolean
        root_trusted:
          type: boolean
        challenge_ok:
          type: boolean
        security_level:
          type: string
        hardware_backed:
          type: boolean
      required:
      - chain_valid
      - challenge_ok
      - hardware_backed
      - present
      - root_trusted
      - security_level
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_email:
          type: string
          maxLength: 254
        action:
          type: string
          maxLength: 64
        mailbox_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        mailbox_email:
          type: string
          maxLength: 254
        target_type:
          type: string
          maxLength: 64
        target_id:
          type: string
          maxLength: 128
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 400
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
    AuditPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true
      required:
      - next_cursor
      - results
    BatchRequest:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventRequest'
      required:
      - events
    BlankEnum:
      enum:
      - ''
    BlockRequestRequest:
      type: object
      properties:
        device:
          type: string
          format: uuid
        address:
          type: string
          minLength: 1
          maxLength: 40
      required:
      - address
      - device
    CallAnnotation:
      type: object
      properties:
        id:
          type: integer
        outcome:
          allOf:
          - $ref: '#/components/schemas/CallOutcomeRef'
          nullable: true
          readOnly: true
        note:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
        author:
          type: string
          readOnly: true
        from_phone:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - author
      - created_at
      - from_phone
      - id
      - note
      - outcome
      - tags
      - updated_at
    CallAnnotationWriteRequest:
      type: object
      properties:
        outcome:
          type: integer
          nullable: true
        note:
          type: string
          default: ''
          maxLength: 2000
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 10
    CallBadges:
      type: object
      properties:
        unreturned:
          type: integer
        open_callbacks:
          type: integer
        my_callbacks:
          type: integer
        attention:
          type: integer
      required:
      - attention
      - my_callbacks
      - open_callbacks
      - unreturned
    CallDetail:
      type: object
      properties:
        id:
          type: integer
        device:
          $ref: '#/components/schemas/CallDeviceRef'
        sim:
          allOf:
          - $ref: '#/components/schemas/CallSimRef'
          nullable: true
          readOnly: true
        direction:
          type: string
        result:
          type: string
        number:
          type: string
        display_number:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_source:
          type: string
          description: phone (saved in the phone's contacts), directory (company directory)
            or "".
          readOnly: true
        customer_id:
          type: integer
          nullable: true
        presentation:
          type: string
        started_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        ring_seconds:
          type: integer
        talk_seconds:
          type: integer
        is_after_hours:
          type: boolean
        is_conference:
          type: boolean
        is_video:
          type: boolean
        origin:
          type: string
        returned_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/CallOutcomeRef'
          nullable: true
          readOnly: true
        deleted_on_device:
          type: boolean
          readOnly: true
        is_final:
          type: boolean
        disconnect_cause_label:
          type: string
        ended_by:
          type: string
        network:
          type: string
        conference_size:
          type: integer
        was_on_hold_seconds:
          type: integer
        returns_call_id:
          type: integer
          nullable: true
        returned_by_id:
          type: integer
          nullable: true
        callback_task_id:
          type: integer
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/CallEvent'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/CallAnnotation'
        history:
          type: array
          items:
            $ref: '#/components/schemas/CallHistoryItem'
        permissions:
          type: object
          additionalProperties:
            type: boolean
        outcome_required:
          type: boolean
      required:
      - annotations
      - answered_at
      - callback_task_id
      - conference_size
      - customer_id
      - deleted_on_device
      - device
      - direction
      - disconnect_cause_label
      - display_number
      - ended_at
      - ended_by
      - events
      - history
      - id
      - is_after_hours
      - is_conference
      - is_final
      - is_video
      - name
      - name_source
      - network
      - number
      - origin
      - outcome
      - outcome_required
      - permissions
      - presentation
      - result
      - returned_at
      - returned_by_id
      - returns_call_id
      - ring_seconds
      - sim
      - started_at
      - talk_seconds
      - was_on_hold_seconds
    CallDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        office:
          type: string
        colour:
          type: string
        status:
          type: string
        calls_enabled:
          type: boolean
          readOnly: true
        online:
