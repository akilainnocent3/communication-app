        schema:
          type: string
        required: true
      - in: query
        name: download
        schema:
          type: boolean
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: preview
        schema:
          type: boolean
      tags:
      - mail
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
