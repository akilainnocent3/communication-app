openapi: 3.0.3
info:
  title: Communication Manager API
  version: 1.0.0
  description: Company admin platform for managing communication channels (Gmail first).
paths:
  /api/v1/audit/events/:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: mailbox
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: YYYY-MM-DD
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
  /api/v1/audit/events/export/:
    get:
      operationId: audit_events_export
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: mailbox
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: YYYY-MM-DD
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/preferences/:
    patch:
      operationId: auth_preferences
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPreferencesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPreferencesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPreferencesRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/totp/disable/:
    post:
      operationId: auth_totp_disable
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/totp/enable/:
    post:
      operationId: auth_totp_enable
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/totp/setup/:
    post:
      operationId: auth_totp_setup
      description: 'Start TOTP enrolment: returns a fresh secret and QR; it is enabled
        only after /totp/enable/ verifies a code.'
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/calls/annotations/{id}/:
    patch:
      operationId: calls_annotations_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCallAnnotationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCallAnnotationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCallAnnotationWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAnnotation'
          description: ''
    delete:
      operationId: calls_annotations_delete
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calls/badges/:
    get:
      operationId: calls_badges
      parameters:
      - in: query
        name: device
        schema:
          type: string
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallBadges'
          description: ''
  /api/v1/calls/callbacks/:
    get:
      operationId: calls_callbacks_list
      parameters:
      - in: query
        name: device
        schema:
          type: string
      - in: query
        name: view
        schema:
          type: string
          enum:
          - all
          - closed
          - done
          - mine
          - open
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Callback'
          description: ''
    post:
      operationId: calls_callbacks_create
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CallbackCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CallbackCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
          description: ''
  /api/v1/calls/callbacks/{id}/:
    get:
      operationId: calls_callbacks_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
          description: ''
    patch:
      operationId: calls_callbacks_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCallbackUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCallbackUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCallbackUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
          description: ''
  /api/v1/calls/callbacks/{id}/cancel/:
    post:
      operationId: calls_callbacks_cancel
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Callback'
          description: ''
  /api/v1/calls/callbacks/bulk/:
    post:
      operationId: calls_callbacks_bulk
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackBulkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CallbackBulkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CallbackBulkRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Callback'
          description: ''
  /api/v1/calls/calls/:
    get:
      operationId: calls_list
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: after_hours
        schema:
          type: boolean
      - in: query
        name: before
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: customer
        schema:
          type: integer
      - in: query
        name: device
        schema:
          type: string
        description: Device id or 'all'
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
      - in: query
        name: folder
        schema:
          type: string
          enum:
          - after_hours
          - all
          - incoming
          - missed
          - outgoing
          - unreturned
      - in: query
        name: max_duration
        schema:
          type: integer
      - in: query
        name: min_duration
        schema:
          type: integer
      - in: query
        name: outcome
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Number or name
      - in: query
        name: result
        schema:
          type: string
        description: Comma separated results
      - in: query
        name: sim
        schema:
          type: integer
      - in: query
        name: staff
        schema:
          type: integer
      - in: query
        name: unreturned
        schema:
          type: boolean
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallPage'
          description: ''
  /api/v1/calls/calls/{id}/:
    get:
      operationId: calls_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: peek
        schema:
          type: boolean
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallDetail'
          description: ''
  /api/v1/calls/calls/{id}/annotations/:
    post:
      operationId: calls_annotations_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallAnnotationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CallAnnotationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CallAnnotationWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAnnotation'
          description: ''
  /api/v1/calls/customers/:
    get:
      operationId: calls_customers_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: string
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
          description: ''
    post:
      operationId: calls_customers_create
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
          description: ''
  /api/v1/calls/customers/{id}/:
    get:
      operationId: calls_customers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
          description: ''
    patch:
      operationId: calls_customers_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
          description: ''
    delete:
      operationId: calls_customers_delete
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calls/customers/{id}/timeline/:
    get:
      operationId: calls_customers_timeline
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallHistoryItem'
          description: ''
  /api/v1/calls/customers/merge/:
    post:
      operationId: calls_customers_merge
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerMergeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerMergeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerMergeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
          description: ''
  /api/v1/calls/devices/:
    get:
      operationId: calls_devices_list
      parameters:
      - in: query
        name: candidates
        schema:
          type: boolean
        description: SMS phones that can be enabled for Calls
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallDevice'
          description: ''
  /api/v1/calls/devices/{id}/access/:
    get:
      operationId: calls_device_access_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallDeviceAccess'
          description: ''
    put:
      operationId: calls_device_access_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CallDeviceAccessRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CallDeviceAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CallDeviceAccessRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallDeviceAccess'
          description: ''
  /api/v1/calls/devices/{id}/enable/:
    post:
      operationId: calls_devices_enable
      description: |-
        Switch Calls on or off for a phone. The phone learns it from its next heartbeat (and a push) and runs the dialer
        onboarding; switching off keeps the history.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallEnableRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CallEnableRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CallEnableRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallDevice'
          description: ''
  /api/v1/calls/devices/{id}/simulator/:
    post:
      operationId: calls_devices_simulator
      description: 'Demo phones only (SMS_ENABLE_SIMULATOR, refused in production):
        ring an incoming call, a missed one, or run a tick.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallSimulatorActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CallSimulatorActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CallSimulatorActionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calls/export/:
    get:
      operationId: calls_export
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: after_hours
        schema:
          type: boolean
      - in: query
        name: before
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: customer
        schema:
          type: integer
      - in: query
        name: device
        schema:
          type: string
        description: Device id or 'all'
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
      - in: query
        name: file_format
        schema:
          type: string
          enum:
          - csv
          - xlsx
      - in: query
        name: folder
        schema:
          type: string
          enum:
          - after_hours
          - all
          - incoming
          - missed
          - outgoing
          - unreturned
      - in: query
        name: max_duration
        schema:
          type: integer
      - in: query
        name: min_duration
        schema:
          type: integer
      - in: query
        name: outcome
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Number or name
      - in: query
        name: result
        schema:
          type: string
        description: Comma separated results
      - in: query
        name: sim
        schema:
          type: integer
      - in: query
        name: staff
        schema:
          type: integer
      - in: query
        name: unreturned
        schema:
          type: boolean
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/calls/live/:
    get:
      operationId: calls_live
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallLive'
          description: ''
  /api/v1/calls/office-hours/:
    get:
      operationId: calls_office_hours_list
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficeHours'
          description: ''
  /api/v1/calls/office-hours/{office_id}/:
    put:
      operationId: calls_office_hours_update
      parameters:
      - in: path
        name: office_id
        schema:
          type: integer
        required: true
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeHoursRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfficeHoursRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfficeHoursRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeHours'
          description: ''
  /api/v1/calls/outcomes/:
    get:
      operationId: calls_outcomes_list
      tags:
      - calls
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
