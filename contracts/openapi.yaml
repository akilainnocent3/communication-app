      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
          description: ''
  /api/v1/mail/drafts/{id}/:
    get:
      operationId: mail_drafts_retrieve
      parameters:
      - in: path
