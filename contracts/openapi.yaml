                  $ref: '#/components/schemas/AccessEntry'
          description: ''
    put:
      operationId: mail_access_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - mail
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AccessEntryRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AccessEntryRequest'
          application/x-www-form-urlencoded:
