      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/totp/enable/:
    post:
      operationId: auth_totp_enable
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/totp/setup/:
    post:
      operationId: auth_totp_setup
      description: 'Start TOTP enrolment: returns a fresh secret and QR; it is enabled
        only after /totp/enable/ verifies a code.'
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/v1/mail/actions/:
    post:
      operationId: mail_actions
      tags:
      - mail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActionRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
          description: ''
  /api/v1/mail/actions/undo/:
