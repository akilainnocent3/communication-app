openapi: 3.0.3
info:
  title: Communication Manager API
  version: 1.0.0
  description: Company admin platform for managing communication channels (Gmail first).
paths:
  /api/v1/audit/events/:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: mailbox
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: YYYY-MM-DD
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
  /api/v1/audit/events/export/:
    get:
      operationId: audit_events_export
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: mailbox
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: YYYY-MM-DD
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/preferences/:
    patch:
      operationId: auth_preferences
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
