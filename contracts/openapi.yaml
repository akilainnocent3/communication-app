      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LabelWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LabelWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
          description: ''
  /api/v1/mail/labels/{id}/:
    patch:
      operationId: mail_labels_update
      parameters:
      - in: path
