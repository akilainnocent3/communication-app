# Local, one command: `docker compose up --build` → http://localhost:3000 (demo data, fake mailboxes).
# Production uses the same file with a real .env (see docs/deployment.md and .env.example).

# Every container's logs rotate (docker's default json-file driver keeps them forever otherwise).
x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DATABASE_URL: postgres://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@postgres:5432/${POSTGRES_DB:-cm}
    # Broker + security store (nonces, lockouts, rate limits): never evicts. Plain cache: its own LRU instance.
    REDIS_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis-cache:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    SMS_MEDIA_ROOT: /data/sms-media
  volumes:
    - smsmedia:/data/sms-media
    # FCM service account (optional): mount the file, never bake it into the image.
    # - ./secrets/fcm.json:/run/secrets/fcm.json:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
  logging: *logging
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cm}
      POSTGRES_DB: ${POSTGRES_DB:-cm}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  # Celery broker and security store. noeviction: under memory pressure writes fail loudly instead of silently
  # dropping queued tasks (outbound SMS, syncs) or replay nonces. AOF: queued tasks survive a restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "",
              "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  # Plain cache (token buckets, push coalescing): evictable, not persisted.
  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-128mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-1}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      start_period: 60s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    depends_on:
      backend: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        CM_API_ORIGIN: http://backend:8000
    # Production: FRONTEND_PORT=127.0.0.1:3000 so only Nginx can reach it (see docs/deployment.md).
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 20s
      retries: 5
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  smsmedia:
