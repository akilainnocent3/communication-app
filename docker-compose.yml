# Local, one command: `docker compose up --build` → http://localhost:3000 (demo data, fake mailboxes).
# Production uses the same file with a real .env (see docs/deployment.md and .env.example).
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DATABASE_URL: postgres://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@postgres:5432/${POSTGRES_DB:-cm}
    REDIS_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cm}
      POSTGRES_DB: ${POSTGRES_DB:-cm}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-1}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/csrf/')"]
      interval: 10s
      start_period: 60s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    depends_on:
      backend: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        CM_API_ORIGIN: http://backend:8000
    # Production: FRONTEND_PORT=127.0.0.1:3000 so only Nginx can reach it (see docs/deployment.md).
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
