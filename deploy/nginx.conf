# Communication Manager — Nginx in front of the Docker stack on a single VPS.
# Rate limit for the phone-facing API (per client address; phones share carrier NAT, so keep it generous). Must be in
# the http {} context: this file is included there by sites-enabled.
limit_req_zone $binary_remote_addr zone=cm_device:10m rate=20r/s;

# Install: copy to /etc/nginx/sites-available/communication-manager, replace mail.company.co.tz,
# symlink into sites-enabled, then `sudo certbot --nginx -d mail.company.co.tz` adds the TLS lines.
# Everything goes to Next.js (127.0.0.1:3000), which proxies /api/v1/* to Django on the Docker network,
# so the session and CSRF cookies stay same-origin.

server {
    listen 80;
    listen [::]:80;
    server_name mail.company.co.tz;

    # Certbot rewrites this block to redirect to HTTPS once a certificate is issued.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.company.co.tz;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/mail.company.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.company.co.tz/privkey.pem;

    # Gmail's 25 MB attachment limit, plus MIME overhead.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Phone API: straight to Django (no Next.js hop). Device-token auth only; the admin API stays behind Next.js.
    # MMS uploads arrive in chunks of at most 512 KB, sync batches are at most 1 MB.
    location /api/v1/device/ {
        limit_req zone=cm_device burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): throttles and the audit log trust the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookies are never used on this API.
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): Django's audit log and login rate limit trust the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # Attachment downloads stream through; do not buffer large files to disk.
        proxy_buffering off;
    }
}
