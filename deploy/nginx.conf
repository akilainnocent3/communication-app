# Communication Manager — Nginx in front of the Docker stack on a single VPS.
# Install: copy to /etc/nginx/sites-available/communication-manager, replace mail.company.co.tz,
# symlink into sites-enabled, then `sudo certbot --nginx -d mail.company.co.tz` adds the TLS lines.
# Everything goes to Next.js (127.0.0.1:3000), which proxies /api/v1/* to Django on the Docker network,
# so the session and CSRF cookies stay same-origin.

server {
    listen 80;
    listen [::]:80;
    server_name mail.company.co.tz;

    # Certbot rewrites this block to redirect to HTTPS once a certificate is issued.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.company.co.tz;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/mail.company.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.company.co.tz/privkey.pem;

    # Gmail's 25 MB attachment limit, plus MIME overhead.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): Django's audit log and login rate limit trust the first entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # Attachment downloads stream through; do not buffer large files to disk.
        proxy_buffering off;
    }
}
