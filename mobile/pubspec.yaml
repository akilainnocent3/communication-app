name: cm_sms
description: "Communication Manager SMS: the company default SMS app for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.3
  dynamic_color: ^2.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  pigeon: ^29.0.11

flutter:
  uses-material-design: true
  generate: true

# The local sync database is encrypted with SQLCipher (package:sqlite3 build hook). The native Kotlin layer opens
# the same file with net.zetetic:sqlcipher-android, so both sides agree on the format.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
