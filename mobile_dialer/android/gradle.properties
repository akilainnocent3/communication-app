org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
# mobile_scanner: use Google Play services' barcode model instead of bundling ML Kit's (about 5 MB per ABI). The QR
# scanner runs once per phone; phones without Play services enroll with the link or the short code (decision 47).
dev.steenbakker.mobile_scanner.useUnbundled=true
